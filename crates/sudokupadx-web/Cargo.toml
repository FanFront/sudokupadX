[package]
name = "sudokupadx-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser WebAssembly adapter for the SudokuPad X Rust puzzle engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
sudokupadx-core = { path = "../sudokupadx-core" }
wasm-bindgen = "0.2"
serde_json = "1"
