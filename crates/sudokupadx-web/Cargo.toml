[package]
name = "sudokupadx-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser WebAssembly adapter for the SudokuPad X Rust puzzle engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
sudokupadx-core = { path = "../sudokupadx-core" }
wasm-bindgen = "0.2"
serde = "1"
serde_json = "1"

# Rust 1.87+ enables WebAssembly bulk-memory by default, including memory.copy.
# wasm-opt must be explicitly told to validate this feature; without the flag
# it fails with "Bulk memory operations require bulk memory".
# Retain wasm-opt release optimization instead of disabling the post-pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]
