[package]
name = "sudokupadx"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[lib]
name = "sudokupadx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2" }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
sudokupadx-core = { path = "../crates/sudokupadx-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[build-dependencies]
tauri-build = { version = "2" }
