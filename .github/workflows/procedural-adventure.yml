name: Procedural Sudoku Adventure

on:
  push:
    paths:
      - 'scripts/generate_adventure.py'
      - 'scripts/boss_dependencies.py'
      - 'tests/test_generate_adventure.py'
      - 'tests/boss-gates.test.mjs'
      - 'tests/generated-adventure.test.mjs'
      - 'src/boss-gates.js'
      - '.github/workflows/procedural-adventure.yml'
  pull_request:
    paths:
      - 'scripts/generate_adventure.py'
      - 'scripts/boss_dependencies.py'
      - 'tests/test_generate_adventure.py'
      - 'tests/boss-gates.test.mjs'
      - 'tests/generated-adventure.test.mjs'
      - 'src/boss-gates.js'
      - '.github/workflows/procedural-adventure.yml'

permissions:
  contents: read

jobs:
  verify-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate seeded world, mandatory boss cells and export
        run: |
          python3 scripts/generate_adventure.py --seed 20261102
          python3 -m unittest discover -s tests -p 'test_generate_adventure.py'
      - name: Check boss completion, fog ordering and linked navigation
        run: node --test tests/boss-gates.test.mjs tests/generated-adventure.test.mjs
