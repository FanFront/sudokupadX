name: Bootstrap Sudokuvania 2 prologue snapshot
on:
  push:
    branches: [fix/sudokuvania2-prologue]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Fetch and verify author's original SCL
        run: node scripts/fetch-prologue.mjs
      - name: Commit verified offline source
        run: |
          git add public/puzzles/prologue-empty-house.scl
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add verified Sudokuvania 2 prologue offline SCL"
            git push
          fi
