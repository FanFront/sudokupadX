name: Validate pull requests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
# Replace stale PR runs rather than queue multiple generators.
concurrency:
  group: sudokupadx-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            public/puzzles
            src/lesson-fixtures.js
          key: offline-puzzles-${{ runner.os }}-${{ hashFiles('scripts/*.py', 'docs/*.zh-CN.md') }}
      - name: Check lesson scripts and candidate logic before expensive generation
        run: |
          python3 -m compileall -q scripts
          node --check src/lesson-puzzles.js
          node --check src/lesson-page.js
          node --test tests/lesson-candidates.test.mjs
      - name: Generate or restore verified offline puzzle library
        run: python3 scripts/prepare_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: certified-offline-puzzles
          path: |
            public/puzzles
            src/lesson-fixtures.js
          include-hidden-files: true
          retention-days: 1
  frontend:
    needs: offline-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: certified-offline-puzzles
          path: .
      - run: npm test
      - run: npm run build
      - run: test -s dist/puzzles/prologue-empty-house.scl
  rust-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sudokupadx-core --all-targets

  browser-wasm:
    needs: offline-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_PAGES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: certified-offline-puzzles
          path: .
      - run: cargo install wasm-pack --locked
      - run: npm run build:web
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Exercise real mobile browser layout, Home, input and resume
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/sudokupadx-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" || true' EXIT
          for i in {1..45}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/sudokupadX/; then break; fi
            sleep 1
          done
          node scripts/web-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-browser-screenshots
          path: artifacts/web/*.png
          if-no-files-found: warn
