name: Deploy puzzle-source CORS relay
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publish restricted Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare API token and account ID must be configured in repository Actions secrets."
            exit 1
          fi
          npx --yes wrangler@4 deploy --config worker/wrangler.toml
