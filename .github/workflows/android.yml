name: Build compact signed Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: sudokupadx-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install Android NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018"
      - name: Install frontend packages
        run: npm install
      - name: Verify puzzle rendering and controls
        run: npm test
      - name: Assign unique increasing Android version code
        run: node scripts/android-release.mjs version
      - name: Generate Android project
        run: npx tauri android init --ci
      - name: Configure permanent test signing and Android shrinker
        run: node scripts/android-release.mjs sign
      - name: Build optimized signed ARM64 release APK
        run: npx tauri android build --apk --target aarch64 --ci
      - name: Verify signing certificate, APK size and version
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          mapfile -t APKS < <(find "$APK_DIR" -type f -name '*.apk' ! -name '*unsigned*' | sort)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          SIGNATURE_REPORT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_REPORT"
          # Both "V2 Signer: certificate" and "Signer #1 certificate" are valid.
          ACTUAL="$(printf '%s\n' "$SIGNATURE_REPORT" | awk '/certificate SHA-256 digest:/ { print tolower($NF); exit }')"
          EXPECTED='8c7c54f2b981c9f3b8ee56cc061afe8e5ac2022fa38e24ae21cf367213665f7f'
          test "${#ACTUAL}" -eq 64
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::APK signing certificate mismatch (got $ACTUAL, expected $EXPECTED)"
            exit 1
          fi
          # Android minSdk=24 needs v2; v1, v3 and v4 can be absent.
          printf '%s\n' "$SIGNATURE_REPORT" | grep -Eq '^Verified using v2 scheme .*: true$'
          echo "APK signing certificate and v2 scheme verified"
          APK_BYTES="$(stat -c%s "$APK")"
          echo "Release APK: $APK ($(numfmt --to=iec "$APK_BYTES"))"
          {
            echo "### Signed release APK"
            echo "File: `$(basename "$APK")`"
            echo "Size: **$(numfmt --to=iec "$APK_BYTES")**"
            echo "Version code: **$((2000000 + GITHUB_RUN_NUMBER))**"
            echo "Certificate: `$ACTUAL`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: SudokuPadX-Android-arm64-release-test-signed
          path: src-tauri/gen/android/app/build/outputs/apk/**/*release*.apk
          if-no-files-found: error
