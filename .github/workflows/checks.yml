name: Rust and frontend checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sudokupadx-core --all-targets
      # Bundled SudokuPad SCL fixtures are covered by --all-targets.
      # The old Android project is private; its optional compatibility suite
      # runs only through the manually triggered reference-assets workflow.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # Puzzle creation is deterministic and expensive, especially the
      # certified 100-puzzle pack. Cache all generated offline resources
      # across runs, then reuse them in prebuild and pretest.
      - uses: actions/cache@v4
        with:
          path: |
            public/puzzles
            src/lesson-fixtures.js
          key: offline-puzzles-${{ runner.os }}-${{ hashFiles('scripts/*.py', 'docs/*.zh-CN.md') }}
      - run: npm run build
      - run: npm test
